# 20 lĩnh vực công nghệ dùng để PHÂN LOẠI TỰ ĐỘNG repo (đa nhãn, có độ tin cậy).
# Khác với danh mục biên tập (data/categories.yaml): lĩnh vực được gán bằng quy tắc minh bạch từ
# topic GitHub (3 điểm), mô tả (2 điểm), tên repo (1 điểm), README (1 điểm/từ khóa xuất hiện ≥ 2 lần, tối đa 3)
# và ngôn ngữ chính (0,5 điểm). Gán nhãn khi tổng ≥ 3 điểm; độ tin cậy = min(0,99; điểm / 8).
# Sửa file này để thêm/bớt từ khóa — không cần sửa mã nguồn. Từ khóa kết thúc bằng * là khớp tiền tố.
# implies: lĩnh vực cha được gán kèm (độ tin cậy × 0,8). combo: cộng 3 điểm khi lĩnh vực `with` cũng khớp
# và repo có một trong các topic/từ khóa liệt kê.

