# Danh mục: Chatbot & LLM — xem cấu trúc trường trong data/README.md
- repo: ollama/ollama
  tags: [local-llm, offline, api, gguf]
  summary: "Chạy các mô hình ngôn ngữ lớn mở (Llama, Qwen, Gemma, DeepSeek, gpt-oss…) trên máy tính chỉ với một lệnh; có API tương thích OpenAI."
  use_cases: ["Chatbot nội bộ không lộ dữ liệu ra ngoài", "'Động cơ' AI cho n8n, Dify, Open WebUI, AnythingLLM", "Thử nghiệm mô hình mở miễn phí"]
  pros: ["Cài đặt cực đơn giản trên Windows, macOS, Linux", "Thư viện mô hình phong phú, cập nhật nhanh", "Không tốn phí API"]
  cons: ["Mô hình chạy local thường kém các mô hình thương mại mới nhất", "Mô hình lớn cần nhiều RAM/VRAM"]
  platforms: [windows, macos, linux, docker]
  deploy: [desktop, cli]
  difficulty: easy
  pricing: freemium
  needs_api_key: none
  requirements: "RAM ≥ 8 GB cho mô hình 7B, 16 GB cho 13B (theo README); GPU giúp chạy nhanh hơn."
  quick_start: |
    Tải bộ cài tại ollama.com/download, sau đó mở Terminal:
    ollama run gemma3
  applicability: 5
  featured: true
- repo: open-webui/open-webui
  tags: [chat-ui, rag, self-hosted, ollama]
  summary: "Giao diện chat kiểu ChatGPT tự host, kết nối Ollama hoặc API tương thích OpenAI; có hỏi đáp tài liệu (RAG), tìm kiếm web, quản lý người dùng."
  use_cases: ["'ChatGPT nội bộ' cho cả công ty", "Hỏi đáp tài liệu nội bộ", "Dùng nhiều mô hình trong một giao diện"]
  pros: ["Trải nghiệm gần giống ChatGPT", "RAG và tìm kiếm web có sẵn", "Phân quyền nhiều người dùng"]
  cons: ["Giấy phép có điều khoản thương hiệu khi dùng quy mô lớn", "Nhiều tùy chọn — cần thời gian cấu hình"]
  platforms: [docker, windows, macos, linux]
  deploy: [self-host, local]
  difficulty: easy
  pricing: freemium
  needs_api_key: optional
  license_note: "Open WebUI License (BSD-3 + điều khoản thương hiệu): khi phục vụ hơn 50 người dùng trong 30 ngày phải giữ nguyên thương hiệu Open WebUI, trừ khi có giấy phép doanh nghiệp."
  quick_start: |
    pip install open-webui      # cần Python 3.11
    open-webui serve
    # Mở http://localhost:8080
  applicability: 5
  featured: true
  license_override:
    class: source-available
    name: Open WebUI License (BSD-3 + điều khoản thương hiệu)
