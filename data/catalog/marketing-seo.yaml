- repo: umami-software/umami
  tags: [web-analytics, privacy, google-analytics-alternative]
  summary: "Phân tích truy cập website đơn giản, nhẹ, tôn trọng quyền riêng tư — thay Google Analytics, tự host miễn phí."
  use_cases: ["Đo lượt truy cập, nguồn traffic, chiến dịch UTM", "Thống kê cho nhiều website khách hàng"]
  pros: ["Giao diện rõ ràng, dễ hiểu hơn GA4", "Không dùng cookie — giảm thủ tục xin đồng ý cookie", "Script nhẹ, không làm chậm web"]
