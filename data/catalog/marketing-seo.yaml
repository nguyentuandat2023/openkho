  platforms: [docker]
  deploy: [self-host, cloud]
  difficulty: easy
  pricing: freemium
  needs_api_key: none
  quick_start: |
    git clone https://github.com/umami-software/umami.git
    cd umami
    docker compose up -d
    # Mở http://localhost:3000 – tài khoản mặc định: admin / umami (đổi ngay mật khẩu)
  applicability: 5
  featured: true
