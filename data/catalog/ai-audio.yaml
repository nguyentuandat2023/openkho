# Danh mục: AI Audio, Voice & Speech (danh mục bổ sung) — xem cấu trúc trường trong data/README.md
- repo: openai/whisper
  tags: [speech-to-text, subtitles, vietnamese]
  summary: "Mô hình nhận dạng giọng nói của OpenAI: chuyển giọng nói thành văn bản cho gần 100 ngôn ngữ (có tiếng Việt) và dịch sang tiếng Anh."
  use_cases: ["Làm phụ đề video", "Gỡ băng phỏng vấn, cuộc họp", "Chuyển podcast thành bài viết"]
  pros: ["Nhận dạng tiếng Việt tốt", "Miễn phí, chạy offline", "Xuất phụ đề SRT/VTT"]
  cons: ["Chậm trên CPU — nên dùng faster-whisper hoặc whisper.cpp", "Có thể 'bịa' chữ ở đoạn nhạc không lời"]
  platforms: [windows, macos, linux]
  deploy: [cli, library]
  difficulty: medium
  pricing: free
  needs_api_key: none
  requirements: "Cần FFmpeg; GPU giúp nhanh hơn nhiều."
  quick_start: |
    pip install -U openai-whisper
    whisper ghi-am.mp3 --language Vietnamese --model turbo
  applicability: 5
  featured: true
