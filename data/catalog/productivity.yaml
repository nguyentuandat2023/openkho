- repo: microsoft/PowerToys
  tags: [windows, utilities, ocr, window-manager]
  summary: "Bộ tiện ích miễn phí của Microsoft cho Windows: đổi tên hàng loạt, chỉnh kích thước ảnh, trích chữ từ màn hình, chia vùng cửa sổ, tìm kiếm nhanh…"
  use_cases: ["Đổi tên và resize hàng loạt ảnh sản phẩm", "Copy chữ từ ảnh/màn hình (Text Extractor)", "Sắp xếp cửa sổ khi làm việc đa màn hình"]
  pros: ["Hàng chục tiện ích trong một bộ cài", "Từ chính Microsoft, cập nhật đều đặn", "Hoàn toàn miễn phí"]
  cons: ["Chỉ dành cho Windows 10/11", "Một số tiện ích chạy nền tốn RAM"]
  platforms: [windows]
  deploy: [desktop]
  difficulty: easy
  pricing: free
  needs_api_key: none
  quick_start: |
    winget install Microsoft.PowerToys --source winget
  applicability: 5
  featured: true
- repo: Stirling-Tools/Stirling-PDF
  tags: [pdf, ocr, self-hosted, acrobat-alternative]
  summary: "Bộ công cụ PDF tự host chạy trên trình duyệt: gộp, tách, nén, chuyển đổi, OCR, ký, đóng dấu… dữ liệu không rời máy chủ của bạn."
  use_cases: ["Xử lý hợp đồng, báo giá PDF hằng ngày", "Nén PDF gửi email", "OCR tài liệu scan"]
  pros: ["Hơn 50 thao tác PDF trong một giao diện", "Thay Adobe Acrobat cho nhu cầu văn phòng", "Dữ liệu nhạy cảm không gửi lên dịch vụ ngoài"]
  cons: ["Bản Docker đầy đủ khá nặng", "Một số tính năng doanh nghiệp tính phí"]
  platforms: [docker, windows, macos, linux]
  deploy: [self-host, desktop]
  difficulty: easy
  pricing: freemium
  needs_api_key: none
  license_note: "Phần lớn mã MIT; một số tính năng nâng cao (Pro/Enterprise) có giấy phép riêng (GitHub hiển thị NOASSERTION)."
  quick_start: |
    docker run -d -p 8080:8080 --name stirling-pdf stirlingtools/stirling-pdf:latest
    # Mở http://localhost:8080
  applicability: 5
  featured: true
  license_override:
    spdx: MIT
    name: MIT + tính năng Pro có giấy phép riêng
