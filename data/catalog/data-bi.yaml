- repo: metabase/metabase
  tags: [bi, dashboard, reporting]
  summary: "Công cụ BI dễ dùng cho doanh nghiệp: đặt câu hỏi với dữ liệu không cần SQL, tạo dashboard và gửi báo cáo định kỳ."
