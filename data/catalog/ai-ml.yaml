- repo: microsoft/markitdown
  tags: [markdown, pdf, office, rag, mcp]
  summary: "Chuyển PDF, Word, Excel, PowerPoint, ảnh, audio… thành Markdown gọn gàng để đưa vào ChatGPT, Claude hoặc hệ thống RAG."
