# Danh mục: AI Automation & Workflow — xem cấu trúc trường trong data/README.md
- repo: n8n-io/n8n
  tags: [workflow, automation, ai-agent, integrations, zapier-alternative]
  summary: "Nền tảng tự động hóa quy trình kéo-thả với hơn 400 tích hợp và node AI Agent — 'Zapier tự host' được dân marketing và doanh nghiệp dùng nhiều nhất."
  use_cases: ["Tự động lấy lead từ form về Google Sheets/CRM", "Chatbot AI trả lời khách qua Telegram, email", "Đăng nội dung đa kênh theo lịch"]
  pros: ["Hơn 400 tích hợp sẵn; nối API bất kỳ qua node HTTP Request", "Node AI Agent kết nối OpenAI, Claude, Gemini, Ollama", "Kho mẫu quy trình cộng đồng khổng lồ"]
  cons: ["Giấy phép fair-code, không phải nguồn mở chuẩn OSI", "Quy trình phức tạp cần hiểu biết về API/JSON", "Tự host phải tự lo sao lưu và bảo mật"]
  platforms: [docker, windows, macos, linux, web]
  deploy: [self-host, cloud, local]
  difficulty: medium
  pricing: freemium
  needs_api_key: optional
  license_note: "Sustainable Use License (fair-code): miễn phí dùng nội bộ và tự host cho doanh nghiệp của bạn; KHÔNG được bán lại n8n dưới dạng dịch vụ. Tính năng doanh nghiệp cần giấy phép riêng."
  quick_start: |
    # Cách 1 – cần Node.js:
    npx n8n
    # Cách 2 – Docker:
    docker volume create n8n_data
    docker run -it --rm --name n8n -p 5678:5678 -v n8n_data:/home/node/.n8n docker.n8n.io/n8nio/n8n
    # Mở http://localhost:5678
  applicability: 5
  featured: true
  license_override:
    class: source-available
    name: Sustainable Use License (fair-code)
- repo: langgenius/dify
  also: [chatbot-llm]
  tags: [llm-app, rag, agent, chatbot, workflow]
  summary: "Nền tảng xây ứng dụng AI (chatbot, agent, quy trình RAG) bằng giao diện trực quan, quản lý kho tri thức, xuất bản API ngay."
  use_cases: ["Chatbot tư vấn sản phẩm từ tài liệu công ty", "Trợ lý nội bộ tra cứu quy trình", "Quy trình AI tạo nội dung hàng loạt"]
  pros: ["Tạo chatbot tri thức từ tài liệu trong vài phút", "Hỗ trợ hàng trăm mô hình (OpenAI, Claude, Gemini, Ollama…)", "Giao diện thân thiện, có nhiều ngôn ngữ"]
  cons: ["Giấy phép có điều kiện khi làm dịch vụ SaaS", "Cần Docker và máy chủ đủ RAM", "Phiên bản thay đổi nhanh"]
  platforms: [docker]
  deploy: [self-host, cloud]
  difficulty: medium
  pricing: freemium
  needs_api_key: optional
  requirements: "Docker; CPU ≥ 2 nhân, RAM ≥ 4 GB (theo README)."
  license_note: "Giấy phép dựa trên Apache 2.0 kèm điều kiện: không vận hành dịch vụ nhiều khách thuê (multi-tenant SaaS) khi chưa có giấy phép thương mại, không gỡ logo/bản quyền Dify trên giao diện."
  quick_start: |
    git clone https://github.com/langgenius/dify.git
    cd dify/docker
    cp .env.example .env
    docker compose up -d
    # Mở http://localhost/install
  applicability: 5
  featured: true
  license_override:
    class: source-available
    name: Dify Open Source License (Apache-2.0 + điều kiện)
