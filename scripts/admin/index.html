<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị OpenKho</title>
<style>
  :root { color-scheme: light; --bg:#fff; --surface:#f6f4f1; --s2:#ece8e2; --line:#e5ded5; --line2:#d2c6b8; --ink:#261a14; --ink2:#66564a; --ink3:#8a7a6d; --accent:#6b2b1d; --accent-ink:#fff6ec; --gold:#8a5f12; --ok:#2b7550; --ok-s:#e2f0e7; --warn:#a5520e; --warn-s:#f8e9da; --danger:#b0372a; --danger-s:#f8e1dc; --info:#2c5a8e; --info-s:#e1eaf5; --code:#1c1410; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#1a1310; --surface:#211813; --s2:#2b201a; --line:#3a2c23; --line2:#4f3d31; --ink:#f2eadf; --ink2:#c4b3a2; --ink3:#9b8877; --accent:#d8b36a; --accent-ink:#1a1310; --gold:#e1bf7a; --ok:#7fc89f; --ok-s:#1d3125; --warn:#eca061; --warn-s:#3a2616; --danger:#ef7660; --danger-s:#3d1e19; --info:#98bce4; --info-s:#1c2938; --code:#120d0a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
  .top { display: flex; align-items: center; gap: 16px; min-height: 60px; flex-wrap: wrap; }
  .brand { font-weight: 800; font-size: 18px; display: flex; gap: 8px; align-items: center; }
  nav[role=tablist] { display: flex; gap: 2px; flex-wrap: wrap; }
  nav button { background: none; border: 0; color: var(--ink2); padding: 8px 12px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  nav button[aria-selected=true] { background: var(--s2); color: var(--ink); }
  main { padding: 24px 0 80px; }
  h1 { font-size: 24px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 28px 0 10px; } p { margin: 6px 0; }
  .muted { color: var(--ink2); } .small { font-size: 13px; } .tnum { font-variant-numeric: tabular-nums; }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .card b { display: block; font-size: 22px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
  .btn:hover { background: var(--s2); } .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; } .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line2); border-radius: 9px; padding: 7px 10px; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--ink2); }
  .form { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form .full { grid-column: 1 / -1; }
  @media (max-width: 720px) { .form { grid-template-columns: 1fr; } }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 500; color: var(--ink); }
  .checks label { display: inline-flex; gap: 6px; align-items: center; } .checks input { width: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--ink2); background: var(--surface); position: sticky; top: 60px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; }
  .ok { color: var(--ok); background: var(--ok-s); } .warn { color: var(--warn); background: var(--warn-s); } .danger { color: var(--danger); background: var(--danger-s); } .info { color: var(--info); background: var(--info-s); }
  .notice { padding: 10px 14px; border-radius: 10px; margin: 10px 0; }
  pre.log { background: var(--code); color: #efe6d9; border-radius: 10px; padding: 12px; max-height: 60vh; overflow: auto; font: 12.5px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  .preview { display: flex; gap: 12px; align-items: flex-start; }
  .preview img { width: 48px; height: 48px; border-radius: 10px; }
  a { color: var(--gold); }
  .hidden { display: none !important; }
  .bar { height: 8px; border-radius: 6px; background: var(--s2); overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--gold); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 14px; } .kv dt { color: var(--ink2); }
  .login { max-width: 360px; margin: 12vh auto; }
  td .row .btn { min-height: 30px; padding: 0 9px; font-size: 13px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 600; z-index: 9; max-width: 92vw; }
</style>
</head>
<body>
<header>
  <div class="wrap top">
    <div class="brand"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="2.5" y="4.5" width="27" height="23" rx="4.5" fill="var(--accent)"/><rect x="8.5" y="9.5" width="15" height="6.5" rx="1.2" fill="none" stroke="var(--accent-ink)" stroke-width="1.7"/><rect x="12" y="20.5" width="8" height="2.6" rx="1.3" fill="var(--accent-ink)"/></svg>Quản trị OpenKho</div>
    <nav role="tablist" aria-label="Khu vực quản trị">
      <button role="tab" data-tab="overview" aria-selected="true">Tổng quan</button>
      <button role="tab" data-tab="add">Thêm repo</button>
      <button role="tab" data-tab="repos">Danh sách repo</button>
      <button role="tab" data-tab="cats">Danh mục</button>
      <button role="tab" data-tab="discover">Khám phá</button>
      <button role="tab" data-tab="auto">Tự động hóa</button>
      <button role="tab" data-tab="radar">Radar</button>
      <button role="tab" data-tab="config">Lịch &amp; trọng số</button>
      <button role="tab" data-tab="check">Kiểm tra</button>
      <button role="tab" data-tab="log">Nhật ký</button>
      <button id="logoutBtn" class="hidden" style="margin-left:6px">Đăng xuất</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Đang tải…</p></main>
<div id="toast" class="hidden" role="status"></div>
<script>
const H = { 'Content-Type': 'application/json', 'X-OpenKho-Admin': '1' };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n === null || n === undefined ? '—' : Number(n).toLocaleString('vi-VN'));
const dt = (iso) => (iso ? new Date(iso).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' }) : '—');
const L = {
  platforms: { windows: 'Windows', macos: 'macOS', linux: 'Linux', docker: 'Docker', web: 'Trình duyệt', android: 'Android', ios: 'iOS' },
  deploy: { desktop: 'Ứng dụng desktop', local: 'Chạy trên máy', 'self-host': 'Tự host', cli: 'Dòng lệnh', library: 'Thư viện', extension: 'Tiện ích mở rộng', skill: 'Skill AI', cloud: 'Có bản cloud', content: 'Tài liệu/danh sách' },
  difficulty: { easy: 'Dễ', medium: 'Trung bình', hard: 'Khó' },
  pricing: { free: 'Miễn phí', freemium: 'Miễn phí + bản trả phí', 'paid-license': 'Cần mua giấy phép' },
  needs_api_key: { none: 'Không cần', optional: 'Tùy chọn', required: 'Bắt buộc' },
  tier: { excellent: 'Xuất sắc', good: 'Tốt', potential: 'Tiềm năng', review: 'Cần kiểm tra' },
  license_class: { permissive: 'Dễ dãi', 'weak-copyleft': 'Copyleft yếu', copyleft: 'Copyleft', content: 'Nội dung CC', 'source-available': 'Hạn chế', noncommercial: 'Phi thương mại', custom: 'Tùy chỉnh', none: 'Không có' },
};
const ICONS = ['brain', 'bot', 'megaphone', 'workflow', 'clapperboard', 'audio-lines', 'message-square', 'plug', 'globe', 'blocks', 'trending-up', 'bar-chart', 'zap', 'film', 'palette', 'shopping-cart', 'handshake', 'server', 'terminal', 'database', 'graduation-cap', 'sparkles'];
let S = null;
let tab = 'overview';
let editing = null; // repo đang sửa
let addPrefill = null;
let lookup = null;
let currentJob = null;
let es = null;

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { ...H, ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && j.login) { showLogin(); throw new Error('Cần đăng nhập'); }
  if (!r.ok) throw new Error(j.error || `Lỗi ${r.status}`);
  return j;
}
function showLogin(msg = '') {
  $('#app').innerHTML = `<form class="login card" id="loginForm"><h1>Đăng nhập quản trị</h1><p class="muted small">Mật khẩu đặt trong biến ADMIN_PASSWORD (.env.local).</p>
    <label class="f">Mật khẩu<input type="password" name="password" autocomplete="current-password" required autofocus></label>
    ${msg ? `<p class="notice danger small">${esc(msg)}</p>` : ''}<p style="margin-top:12px"><button class="btn primary">Đăng nhập</button></p></form>`;
  $('#loginForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const r = await fetch('/api/login', { method: 'POST', headers: H, body: JSON.stringify({ password: new FormData(ev.target).get('password') }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return showLogin(j.error || 'Đăng nhập thất bại');
    $('#logoutBtn').classList.remove('hidden');
    load();
  });
}
function toast(msg, ms = 3200) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), ms); }
async function load() { S = await api('/api/state'); render(); }
function setTab(t) { tab = t; document.querySelectorAll('nav [role=tab]').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === t)); render(); }
document.querySelectorAll('nav [role=tab]').forEach((b) => b.addEventListener('click', () => { if (b.dataset.tab === 'add') { editing = null; } setTab(b.dataset.tab); }));
$('#logoutBtn').setAttribute('class', 'btn hidden');

function render() {
  const app = $('#app');
  if (!S) return;
  if (['auto', 'radar', 'config', 'check'].includes(tab)) { app.innerHTML = '<p class="muted">Đang tải…</p>'; return AUTO[tab](app).catch((e) => { app.innerHTML = `<div class="notice danger">${esc(e.message)}</div>`; }); }
  app.innerHTML = ({ overview, add: form, repos, cats, discover: disc, log })[tab]();
  bind[tab]?.(app);
}

// ---------------------------------------------------------------- Hệ thống tự động
const JOBST = { success: ['ok', 'thành công'], failed: ['danger', 'thất bại'], timeout: ['danger', 'quá giờ'], interrupted: ['warn', 'bị gián đoạn'], deferred: ['warn', 'hoãn (hết hạn mức)'], skipped: ['info', 'bỏ qua (đang có job khác)'], running: ['info', 'đang chạy'] };
const jtag = (st) => { const [c, t] = JOBST[st] || ['info', st || 'chưa chạy']; return `<span class="tag ${c}">${t}</span>`; };
const dur = (ms) => (ms ? (ms >= 60000 ? `${Math.round(ms / 60000)} phút` : `${Math.round(ms / 1000)} giây`) : '');
const AUTO = {
  async auto(app) {
    const D = await api('/api/dashboard');
    const t = D.totals;
    const sch = D.scheduler;
    const lockTxt = sch.lock.held ? `${esc(sch.lock.lock?.job || '?')} (PID ${sch.lock.lock?.pid ?? '?'}, ${sch.lock.age_min} phút${sch.lock.stale ? ', <b>TREO</b>' : ''})` : 'trống';
    const core = D.rate?.core; const search = D.rate?.search; const gql = D.rate?.graphql;
    app.innerHTML = `
      <h1>Tự động hóa</h1>
      <p class="muted">Đồng bộ dữ liệu thành công gần nhất: <b>${dt(D.last_sync.data)}</b> · xếp hạng tính lúc ${dt(D.last_sync.ranking)} · dữ liệu website tạo lúc ${dt(D.last_sync.library_generated)}${D.last_sync.stale ? ' · <span class="tag warn">dữ liệu cũ</span>' : ''}</p>
      ${D.settings_warnings.length ? `<div class="notice warn small">Cấu hình: ${D.settings_warnings.map(esc).join('; ')}</div>` : ''}
      <div class="grid">
        <div class="card"><span class="muted small">Repo catalog</span><b class="tnum">${fmt(t.curated)}</b></div>
        <div class="card"><span class="muted small">Repo radar (tự phát hiện)</span><b class="tnum">${fmt(t.radar)}</b></div>
        <div class="card"><span class="muted small">Mới phát hiện 24 giờ / 7 ngày</span><b class="tnum">${fmt(t.new_24h)} / ${fmt(t.new_7d)}</b></div>
        <div class="card"><span class="muted small">Có trang chi tiết</span><b class="tnum">${fmt(t.published)}</b></div>
        <div class="card"><span class="muted small">Có điểm xu hướng 24h / 7d / 30d</span><b class="tnum">${D.trending ? `${fmt(D.trending.d1.scored)} / ${fmt(D.trending.d7.scored)} / ${fmt(D.trending.d30.scored)}` : '—'}</b></div>
        <div class="card"><span class="muted small">Ẩn · loại trừ · ghim · nghi spam</span><b class="tnum">${fmt(t.hidden)} · ${fmt(t.excluded)} · ${fmt(t.pinned)} · ${fmt(t.suppressed)}</b></div>
      </div>
      <h2>Bộ lập lịch</h2>
      <dl class="kv">
        <dt>Trạng thái</dt><dd>${sch.enabled ? '<span class="tag ok">BẬT</span>' : '<span class="tag warn">TẮT</span>'} <button class="btn" data-toggle="${sch.enabled ? 'off' : 'on'}">${sch.enabled ? 'Tắt tự động cập nhật' : 'Bật tự động cập nhật'}</button></dd>
        <dt>Daemon trên máy này</dt><dd>${sch.daemon.running ? `đang chạy (PID ${sch.daemon.pid}, heartbeat ${dt(sch.daemon.heartbeat_at)})` : 'không chạy — khởi động bằng <code>npm run scheduler</code> (hoặc dùng GitHub Actions)'}</dd>
        <dt>Khóa chống chạy trùng</dt><dd>${lockTxt} ${sch.lock.held ? `<button class="btn" data-unlock="${sch.lock.stale ? 0 : 1}">Gỡ khóa</button>` : ''}</dd>
        <dt>Hạn mức GitHub API</dt><dd class="tnum">core ${core ? `${core.remaining}/${core.limit}` : '?'} · search ${search ? `${search.remaining}/${search.limit}` : '?'}/phút · graphql ${gql ? `${gql.remaining}/${gql.limit}` : '?'} · ${D.token ? 'có token' : '<span class="tag warn">không token</span>'}</dd>
        <dt>Phân tích AI</dt><dd>${D.ai.ok ? '<span class="tag ok">sẵn sàng</span>' : `<span class="tag info">tắt</span> <span class="small muted">${esc(D.ai.reason)}</span>`}</dd>
      </dl>
      <div class="row" style="margin-top:10px"><button class="btn primary" data-rundue="1">Chạy các job đến hạn</button></div>
      <div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>Job</th><th>Chu kỳ</th><th>Lần cuối</th><th>Thành công gần nhất</th><th>Lần tới</th><th></th></tr></thead><tbody>
      ${D.jobs.map((j) => `<tr><td><b>${esc(j.label)}</b><div class="small muted">${esc(j.name)}${j.enabled ? '' : ' · <span class="tag warn">tắt</span>'}</div></td>
        <td class="tnum">${j.interval_hours} giờ</td>
        <td>${j.running ? jtag('running') : jtag(j.last_status)}<div class="small muted">${dt(j.last_finished_at)} ${dur(j.last_duration_ms)}</div>${j.last_error && j.last_status !== 'success' ? `<div class="small" style="color:var(--danger)">${esc(j.last_error).slice(0, 200)}</div>` : ''}${j.last_summary ? `<div class="small muted">${esc(j.last_summary)}</div>` : ''}</td>
        <td class="small">${dt(j.last_success_at)}${j.consecutive_failures ? `<div class="tag danger">lỗi liên tiếp ${j.consecutive_failures}</div>` : ''}</td>
        <td class="small">${j.due ? '<span class="tag warn">đến hạn</span>' : dt(j.next_at)}<div class="muted">${esc(j.note || '')}</div></td>
        <td><button class="btn" data-run="${j.name}">Chạy ngay</button></td></tr>`).join('')}
      </tbody></table></div>
      <h2>Lịch sử chạy</h2>
      <div style="overflow-x:auto"><table><thead><tr><th>Bắt đầu</th><th>Job</th><th>Kích hoạt</th><th>Kết quả</th><th>Thời gian</th><th>Tóm tắt / lỗi</th><th></th></tr></thead><tbody>
      ${D.history.map((r) => `<tr><td class="small">${dt(r.started_at)}</td><td>${esc(r.job)}</td><td class="small">${esc(r.trigger || '')}</td><td>${jtag(r.status)}</td><td class="small">${dur(r.duration_ms)}</td><td class="small">${esc(r.summary || r.error || '')}</td><td>${r.id ? `<button class="btn" data-log="${esc(r.id)}">Nhật ký</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div>
      <h2>Lỗi API gần đây</h2>
      ${D.api_errors.length ? `<ul class="small">${D.api_errors.map((e) => `<li>${dt(e.at)} · ${esc(e.source)} · ${esc(e.status)}: ${esc(e.error).slice(0, 220)}</li>`).join('')}</ul>` : '<p class="muted small">Không có.</p>'}
      <h2>Sức khỏe dữ liệu</h2>
      <p class="small muted">Catalog: ${D.db_health.catalog.count} repo, ${D.db_health.catalog.errors} lỗi, ${D.db_health.catalog.warnings} cảnh báo · snapshot theo ngày: ${D.db_health.snapshot_months.join(', ') || 'chưa có'} · ${fmt(D.db_health.recent_points)} điểm đo gần đây</p>
      <div style="overflow-x:auto"><table><thead><tr><th>File</th><th>Kích thước</th><th>Cập nhật</th><th>Trạng thái</th></tr></thead><tbody>
      ${D.db_health.files.map((f) => `<tr><td class="small">${esc(f.path)}</td><td class="tnum small">${f.missing ? '—' : fmt(Math.round(f.bytes / 1024)) + ' KB'}</td><td class="small">${f.missing ? '—' : dt(f.modified)}</td><td>${f.missing ? '<span class="tag info">chưa có</span>' : f.valid_json ? '<span class="tag ok">hợp lệ</span>' : '<span class="tag danger">JSON hỏng</span>'}</td></tr>`).join('')}
      </tbody></table></div>
      <h2>Chất lượng dữ liệu</h2>
      ${D.data_quality ? `<ul class="small">
        <li>Repo catalog chưa có GitHub ID: ${D.data_quality.curated_missing_github_id.length}</li>
        <li>Chưa có số người đóng góp: ${fmt(D.data_quality.missing_contributors)}</li>
        <li>Độ phủ Quality Score dưới 70%: ${fmt(D.data_quality.low_quality_coverage)}</li>
        <li>Số liệu cũ hơn 48 giờ: ${fmt(D.data_quality.stale_over_48h.length)}</li>
        <li>Không còn truy cập được: ${D.data_quality.not_found.map((x) => esc(x.id)).join(', ') || 'không có'}</li>
        <li>Đổi tên/chuyển chủ: ${D.data_quality.renamed.map((x) => `${esc(x.from)} → ${esc(x.to)}`).join(', ') || 'không có'}</li>
        <li>Tín hiệu bất thường: ${D.data_quality.anomalies.length} repo</li>
        <li>Cụm repo nhân bản bị loại tự động: ${(D.data_quality.suppressed_clusters || []).map((c) => `${esc(c.cluster)} (${c.repos.length})`).join(', ') || 'không có'}</li>
      </ul>` : '<p class="muted small">Chưa có — chạy job rank.</p>'}
      <h2>Theo lĩnh vực / danh mục</h2>
      <p class="small">${D.areas.map((a) => `${esc(a.name)} <b class="tnum">${fmt(a.count)}</b>`).join(' · ')}</p>
      <p class="small muted">${D.categories.map((c) => `${esc(c.name)} ${fmt(c.count)}`).join(' · ')}</p>`;
    app.onclick = async (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      try {
        if (b.dataset.run) follow((await api('/api/jobs/run', { method: 'POST', body: JSON.stringify({ job: b.dataset.run }) })).job);
        if (b.dataset.rundue) follow((await api('/api/jobs/run-due', { method: 'POST', body: '{}' })).job);
        if (b.dataset.toggle) { await api('/api/settings', { method: 'PUT', body: JSON.stringify({ patch: { scheduler: { enabled: b.dataset.toggle === 'on' } } }) }); toast('Đã lưu.'); render(); }
        if (b.dataset.unlock !== undefined) { if (b.dataset.unlock === '1' && !confirm('Job vẫn có vẻ đang chạy. Gỡ khóa có thể gây chạy trùng. Tiếp tục?')) return; await api('/api/scheduler/unlock', { method: 'POST', body: JSON.stringify({ force: b.dataset.unlock === '1' }) }); toast('Đã gỡ khóa.'); render(); }

function statusTag(st) {
  const m = { ok: ['ok', 'Bình thường'], archived: ['warn', 'Đã lưu trữ'], not_found: ['danger', 'Không còn tồn tại'], blocked: ['danger', 'Bị chặn'], unverified: ['info', 'Chưa kiểm tra lại'], pending: ['info', 'Chờ đồng bộ'] };
  const [c, t] = m[st] || ['info', st || 'Chờ đồng bộ'];
  return `<span class="tag ${c}">${t}</span>`;
}

  return `
    <h1>${isEdit ? `Sửa ${esc(e.repo)}` : 'Thêm repo vào thư viện'}</h1>
    <p class="muted">Chỉ cần đúng tên repo trên GitHub; mọi số liệu (sao, fork, giấy phép, ngày cập nhật…) được lấy tự động. Các trường còn lại là nội dung biên tập tiếng Việt.</p>
    ${isEdit ? '' : `
    <div class="row" style="margin:14px 0">
      <input id="repoInput" placeholder="owner/ten-repo hoặc https://github.com/owner/ten-repo" value="${esc(pre.repo || '')}" style="max-width:520px">
      <button class="btn" data-act="lookup">Kiểm tra trên GitHub</button>
    </div>
    <div id="lookupBox">${lookupHtml()}</div>`}
    <form id="repoForm" class="form" ${!isEdit && !lookup?.ok ? 'hidden' : ''}>
      <label class="f">Danh mục chính<select name="category" required>${cats.map((c) => `<option value="${c.slug}" ${c.slug === (e.category || pre.category || lookup?.suggest?.[0]) ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label class="f">Tính ứng dụng (1–5)<select name="applicability">${options({ 5: '5 – Rất hữu ích', 4: '4', 3: '3', 2: '2', 1: '1 – Ít hữu ích' }, String(e.applicability || ''))}</select></label>
      <div class="f full">Danh mục phụ<div class="checks">${cats.map((c) => `<label><input type="checkbox" name="also" value="${c.slug}" ${(e.also || []).includes(c.slug) ? 'checked' : ''}> ${esc(c.short)}</label>`).join('')}</div></div>
      <label class="f full">Mô tả ngắn tiếng Việt (1–2 câu)<textarea name="summary" required>${esc(e.summary || '')}</textarea></label>
      <label class="f">Ứng dụng thực tế (mỗi dòng một ý)<textarea name="use_cases">${esc(lines(e.use_cases))}</textarea></label>
      <label class="f">Tính năng nổi bật (mỗi dòng một ý — để trống sẽ trích từ README)<textarea name="features">${esc(lines(e.features))}</textarea></label>
      <label class="f">Ưu điểm (mỗi dòng một ý)<textarea name="pros">${esc(lines(e.pros))}</textarea></label>
      <label class="f">Nhược điểm (mỗi dòng một ý)<textarea name="cons">${esc(lines(e.cons))}</textarea></label>
      <div class="f">Nền tảng hỗ trợ${checks('platforms', S.enums.platforms, e.platforms)}</div>
      <div class="f">Cách sử dụng${checks('deploy', S.enums.deploy, e.deploy)}</div>
      <label class="f">Độ khó cài đặt<select name="difficulty">${options(L.difficulty, e.difficulty)}</select></label>
      <label class="f">Chi phí<select name="pricing">${options(L.pricing, e.pricing)}</select></label>
      <label class="f">Cần khóa API dịch vụ AI<select name="needs_api_key">${options(L.needs_api_key, e.needs_api_key)}</select></label>
      <label class="f">Từ khóa (cách nhau bằng dấu phẩy)<input name="tags" value="${esc(commas(e.tags))}"></label>
      <label class="f full">Yêu cầu cấu hình<input name="requirements" value="${esc(e.requirements || '')}"></label>
      <label class="f full">Lệnh cài nhanh (tùy chọn)<textarea name="quick_start" style="font-family:ui-monospace,Consolas,monospace">${esc(e.quick_start || '')}</textarea></label>
      <label class="f">Ghi chú giấy phép<textarea name="license_note">${esc(e.license_note || '')}</textarea></label>
      <label class="f">Cảnh báo/ghi chú biên tập<textarea name="note">${esc(e.note || '')}</textarea></label>
      <label class="f">Link tài liệu (https://)<input name="docs" value="${esc(e.docs || '')}"></label>
      <label class="f">Link demo chính thức (https://)<input name="demo" value="${esc(e.demo || '')}"></label>
      <label class="f">Video demo YouTube (https://)<input name="video" value="${esc(e.video || '')}"></label>
      <label class="f">Gợi ý thay thế (owner/repo, cách nhau dấu phẩy)<input name="alternatives" value="${esc(commas(e.alternatives))}"></label>
      <fieldset class="full card"><legend class="small muted">Ghi đè phân loại giấy phép (chỉ dùng khi GitHub hiển thị NOASSERTION/sai)</legend>
        <div class="form">
          <label class="f">Mã SPDX<input name="lo_spdx" value="${esc(lo.spdx || '')}" placeholder="vd. MIT, GPL-3.0"></label>
          <label class="f">Nhóm<select name="lo_class">${options(L.license_class, lo.class, '— Theo SPDX —')}</select></label>
          <label class="f full">Tên hiển thị<input name="lo_name" value="${esc(lo.name || '')}"></label>
        </div>
      </fieldset>
      <label class="f full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="featured" ${e.featured ? 'checked' : ''} style="width:auto"> Hiện ở mục “Biên tập chọn” trang chủ</label>
      <div class="full row">
        <button class="btn primary" type="submit">${isEdit ? 'Lưu thay đổi' : 'Thêm và đồng bộ số liệu'}</button>
        ${isEdit ? '<button class="btn" type="button" data-act="cancel-edit">Hủy</button>' : ''}
      </div>
    </form>`;
}

function lookupHtml() {
  if (!lookup) return '';
  if (!lookup.ok) return `<div class="notice danger">${esc(lookup.error)}</div>`;
  const r = lookup.repo;
  return `<div class="card preview">
    <img src="${esc(r.avatar_url)}" alt="">
    <div><b>${esc(r.full_name)}</b> ${r.archived ? '<span class="tag warn">Đã lưu trữ</span>' : ''} ${lookup.exists ? '<span class="tag danger">Đã có trong thư viện</span>' : ''} ${lookup.renamed ? '<span class="tag info">Đã đổi tên</span>' : ''}
      <p class="small">${esc(r.description || '')}</p>
      <p class="small muted tnum">${fmt(r.stars)} sao, ${fmt(r.forks)} fork, giấy phép ${esc(r.license || 'không có')}, ngôn ngữ ${esc(r.language || '—')}, commit gần nhất ${dt(r.pushed_at)}. Gợi ý danh mục: ${esc(lookup.suggest.join(', ') || '—')}</p>
    </div></div>`;
}

function collect(f) {
  const fd = new FormData(f);
  const arr = (k) => fd.getAll(k);
  const ln = (k) => String(fd.get(k) || '').split('\n').map((s) => s.trim()).filter(Boolean);
  const cm = (k) => String(fd.get(k) || '').split(',').map((s) => s.trim()).filter(Boolean);
  const lo = { spdx: String(fd.get('lo_spdx') || '').trim(), class: fd.get('lo_class') || '', name: String(fd.get('lo_name') || '').trim() };
  const fields = {
    also: arr('also').filter((s) => s !== fd.get('category')), summary: String(fd.get('summary') || '').trim(), use_cases: ln('use_cases'), features: ln('features'), pros: ln('pros'), cons: ln('cons'),
    platforms: arr('platforms'), deploy: arr('deploy'), difficulty: fd.get('difficulty'), pricing: fd.get('pricing'), needs_api_key: fd.get('needs_api_key'),
    tags: cm('tags'), requirements: String(fd.get('requirements') || '').trim(), quick_start: String(fd.get('quick_start') || '').trimEnd(),
    license_note: String(fd.get('license_note') || '').trim(), note: String(fd.get('note') || '').trim(), docs: String(fd.get('docs') || '').trim(), demo: String(fd.get('demo') || '').trim(),
    video: String(fd.get('video') || '').trim(), alternatives: cm('alternatives'), applicability: fd.get('applicability') ? Number(fd.get('applicability')) : null, featured: fd.get('featured') ? true : null,
    license_override: lo.spdx || lo.class || lo.name ? Object.fromEntries(Object.entries(lo).filter(([, v]) => v)) : null,
  };
  return { category: fd.get('category'), fields };
}

function repos() {
  const q = (S._q || '').toLowerCase();
  const cat = S._cat || '';
  const rows = S.entries.filter((e) => (!cat || e.category === cat) && (!q || `${e.repo} ${e.summary || ''}`.toLowerCase().includes(q)));
  return `
    <h1>Danh sách repo <span class="muted tnum">(${rows.length}/${S.entries.length})</span></h1>
    <div class="row" style="margin:12px 0">
      <input id="fq" placeholder="Lọc theo tên hoặc mô tả" value="${esc(S._q || '')}" style="max-width:320px">
      <select id="fc" style="max-width:260px"><option value="">Tất cả danh mục</option>${S.categories.map((c) => `<option value="${c.slug}" ${c.slug === cat ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Repo</th><th>Danh mục</th><th>Điểm</th><th>Sao</th><th>Trạng thái</th><th>Đồng bộ lúc</th><th></th></tr></thead>
      <tbody>${rows.map((e) => `<tr>
        <td><a href="https://github.com/${esc(e.live?.full_name || e.repo)}" target="_blank" rel="noopener">${esc(e.repo)}</a><div class="small muted">${esc((e.summary || '').slice(0, 90))}</div></td>
        <td class="small">${esc(e.category)}</td>
        <td class="tnum">${e.live?.score ?? '—'}<div class="small muted">${esc(L.tier[e.live?.tier] || '')}</div></td>
        <td class="tnum">${fmt(e.live?.stars)}</td>
        <td>${statusTag(e.live?.status)}</td>
        <td class="small tnum">${dt(e.live?.fetched_at)}</td>
        <td><div class="row"><button class="btn" data-edit="${esc(e.repo)}">Sửa</button><button class="btn" data-sync="${esc(e.repo)}">Đồng bộ</button><button class="btn danger" data-del="${esc(e.repo)}">Xóa</button></div></td>
      </tr>`).join('')}</tbody></table></div>`;
}

function cats() {
  const count = (slug) => S.entries.filter((e) => e.category === slug || (e.also || []).includes(slug)).length;
  return `
    <h1>Danh mục</h1>
    <p class="muted">Thứ tự ở đây là thứ tự hiển thị trên website. Slug là địa chỉ trang (/danh-muc/slug) — không nên đổi sau khi đã xuất bản.</p>
    <div style="overflow-x:auto"><table>
      <thead><tr><th></th><th>Slug</th><th>Tên</th><th>Tên ngắn</th><th>Mô tả</th><th>Biểu tượng</th><th>Màu</th><th>Repo</th><th></th></tr></thead>
      <tbody>${S.categories.map((c, i) => `<tr data-slug="${c.slug}">
        <td><div class="row"><button class="btn" data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Lên">↑</button><button class="btn" data-down="${i}" ${i === S.categories.length - 1 ? 'disabled' : ''} aria-label="Xuống">↓</button></div></td>
        <td class="small">${esc(c.slug)}</td>
        <td><input data-k="name" value="${esc(c.name)}"></td>
        <td><input data-k="short" value="${esc(c.short || '')}"></td>
        <td><textarea data-k="description">${esc(c.description || '')}</textarea></td>
        <td><select data-k="icon">${ICONS.map((ic) => `<option ${ic === c.icon ? 'selected' : ''}>${ic}</option>`).join('')}</select></td>
        <td><input data-k="hue" type="number" min="0" max="360" value="${c.hue ?? 210}" style="width:80px"><div style="height:6px;border-radius:3px;margin-top:4px;background:oklch(0.65 0.12 ${c.hue ?? 210})"></div></td>
        <td class="tnum">${count(c.slug)}</td>
        <td><div class="row"><button class="btn" data-savecat="${c.slug}">Lưu</button><button class="btn danger" data-delcat="${c.slug}" ${count(c.slug) ? 'disabled title="Còn repo trong danh mục"' : ''}>Xóa</button></div></td>
      </tr>`).join('')}</tbody></table></div>
    <h2>Thêm danh mục</h2>
    <form id="newCat" class="form">
      <label class="f">Slug (vd. ai-education)<input name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*"></label>
      <label class="f">Tên đầy đủ<input name="name" required></label>
      <label class="f">Tên ngắn<input name="short"></label>
      <label class="f">Biểu tượng<select name="icon">${ICONS.map((ic) => `<option>${ic}</option>`).join('')}</select></label>
      <label class="f full">Mô tả<textarea name="description"></textarea></label>
      <label class="f">Màu (0–360)<input name="hue" type="number" min="0" max="360" value="210"></label>
      <div class="full"><button class="btn primary">Thêm danh mục</button></div>
    </form>`;
}

function disc() {
  const items = S._found || S.candidates || [];
  return `
    <h1>Khám phá repo mới</h1>
    <p class="muted">Tìm qua GitHub Search API (không token: 10 lượt/phút). Kết quả chỉ là ứng viên — bạn duyệt rồi mới thêm vào thư viện.</p>
    <div class="row" style="margin:12px 0">${S.presets.map((p) => `<button class="btn" data-q="${esc(p.q)}">${esc(p.label)}</button>`).join('')}</div>
    <form id="dq" class="row"><input name="q" placeholder="Truy vấn GitHub, vd. topic:seo stars:>500 pushed:>2026-06-01" style="max-width:560px"><button class="btn primary">Tìm</button></form>
    <p class="small muted" style="margin-top:12px">${S._found ? `${items.length} kết quả mới` : `Ứng viên đã lưu: ${items.length}`}</p>
    <div style="overflow-x:auto"><table><thead><tr><th>Repo</th><th>Sao</th><th>Giấy phép</th><th>Gợi ý danh mục</th><th></th></tr></thead><tbody>
      ${items.map((r) => `<tr><td><a href="${esc(r.html_url || `https://github.com/${r.full_name}`)}" target="_blank" rel="noopener">${esc(r.full_name)}</a><div class="small muted">${esc((r.description || '').slice(0, 140))}</div></td>
        <td class="tnum">${fmt(r.stars)}</td><td class="small">${esc(r.license || 'không có')}</td><td class="small">${esc((r.suggest || []).join(', '))}</td>
        <td><div class="row"><button class="btn primary" data-add="${esc(r.full_name)}" data-cat="${esc((r.suggest || [])[0] || '')}">Thêm</button><button class="btn" data-dismiss="${esc(r.full_name)}">Bỏ qua</button></div></td></tr>`).join('')}
    </tbody></table></div>`;
}

function log() {
  const jobs = S.jobs || [];
  return `
    <h1>Nhật ký tác vụ</h1>
    ${jobs.length ? `<p class="small muted">${jobs.map((j) => `${esc(j.label)}: ${j.status === 'running' ? 'đang chạy' : j.status === 'done' ? 'xong' : 'lỗi'} (${dt(j.startedAt)})`).join(' — ')}</p>` : '<p class="muted">Chưa có tác vụ nào trong phiên này.</p>'}
    <pre class="log" id="logbox">${esc((S._log || []).join('\n'))}</pre>
    <p class="small muted">Sau khi đồng bộ, bấm “Build website” ở tab Tổng quan rồi xem thử bằng <b>npm start</b> (hoặc file 3_MO_WEBSITE.bat). Để đưa lên mạng: commit và push lên GitHub — GitHub Actions sẽ tự build và triển khai.</p>`;
}

function follow(jobId) {
  currentJob = jobId;
  S._log = [];
  setTab('log');
  if (es) es.close();
  es = new EventSource(`/api/jobs/${jobId}/stream`);
  es.onmessage = (ev) => { S._log.push(JSON.parse(ev.data)); const b = $('#logbox'); if (b) { b.textContent = S._log.join('\n'); b.scrollTop = b.scrollHeight; } };
  es.addEventListener('end', async () => { es.close(); const log = S._log; await load(); S._log = log; render(); toast('Tác vụ đã kết thúc.'); });
}

const bind = {
  overview(app) {
    app.addEventListener('click', async (ev) => {
      const act = ev.target.closest('[data-act]')?.dataset.act;
      try {
        if (act === 'sync') follow((await api('/api/jobs/sync', { method: 'POST', body: '{}' })).job);
        if (act === 'fix-renames') follow((await api('/api/jobs/sync', { method: 'POST', body: JSON.stringify({ fixRenames: true }) })).job);
        if (act === 'build') follow((await api('/api/jobs/build', { method: 'POST', body: '{}' })).job);
        if (act === 'validate') { const v = await api('/api/jobs/validate', { method: 'POST', body: '{}' }); toast(v.errors.length ? `${v.errors.length} lỗi: ${v.errors[0]}` : `Catalog hợp lệ (${v.count} repo, ${v.warnings.length} cảnh báo).`, 6000); }
      } catch (e) { toast(e.message, 6000); }
    });
  },
  add(app) {
    app.addEventListener('click', async (ev) => {
      const act = ev.target.closest('[data-act]')?.dataset.act;
      if (act === 'lookup') {
        const v = $('#repoInput').value;
        $('#lookupBox').innerHTML = '<p class="muted">Đang kiểm tra trên GitHub…</p>';
        try { lookup = await api(`/api/lookup?repo=${encodeURIComponent(v)}`); } catch (e) { lookup = { ok: false, error: e.message }; }
        addPrefill = { repo: v, category: addPrefill?.category };
        render();
      }
      if (act === 'cancel-edit') { editing = null; setTab('repos'); }
    });
    const f = $('#repoForm');
    f?.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const { category, fields } = collect(f);
      try {
        if (editing) {
          await api(`/api/repos/${editing.repo.split('/').map(encodeURIComponent).join('/')}`, { method: 'PUT', body: JSON.stringify({ category, fields }) });
          toast('Đã lưu. Bấm “Build website” để cập nhật trang.');
          editing = null; await load(); setTab('repos');
        } else {
          if (lookup?.exists) return toast('Repo đã có trong thư viện.');
          const r = await api('/api/repos', { method: 'POST', body: JSON.stringify({ repo: lookup.repo.full_name, category, fields }) });
          lookup = null; addPrefill = null;
          toast(`Đã thêm ${r.repo}, đang đồng bộ số liệu…`);
          follow(r.job);
        }
      } catch (e) { toast(e.message, 6000); }
    });
  },
  repos(app) {
    $('#fq').addEventListener('input', (e) => { S._q = e.target.value; const pos = e.target.selectionStart; render(); const n = $('#fq'); n.focus(); n.setSelectionRange(pos, pos); });
    $('#fc').addEventListener('change', (e) => { S._cat = e.target.value; render(); });
    app.addEventListener('click', async (ev) => {
      const t = ev.target.closest('button');
      if (!t) return;
      try {
        if (t.dataset.edit) { editing = S.entries.find((e) => e.repo === t.dataset.edit); setTab('add'); }
        if (t.dataset.sync) follow((await api('/api/jobs/sync', { method: 'POST', body: JSON.stringify({ only: t.dataset.sync }) })).job);
        if (t.dataset.del && confirm(`Xóa ${t.dataset.del} khỏi thư viện? (Không ảnh hưởng repo trên GitHub)`)) {
          await api(`/api/repos/${t.dataset.del.split('/').map(encodeURIComponent).join('/')}`, { method: 'DELETE' });
          toast('Đã xóa.'); await load();
        }
      } catch (e) { toast(e.message, 6000); }
    });
  },
  cats(app) {
    app.addEventListener('click', async (ev) => {
      const t = ev.target.closest('button');
      if (!t) return;
      try {
        if (t.dataset.savecat) {
          const tr = t.closest('tr');
          const data = { slug: t.dataset.savecat };
          tr.querySelectorAll('[data-k]').forEach((el) => { data[el.dataset.k] = el.value; });
          await api('/api/categories', { method: 'POST', body: JSON.stringify(data) });
          toast('Đã lưu danh mục.'); await load();
        }
        if (t.dataset.delcat && confirm(`Xóa danh mục ${t.dataset.delcat}?`)) { await api(`/api/categories/${t.dataset.delcat}`, { method: 'DELETE' }); toast('Đã xóa.'); await load(); }
        if (t.dataset.up || t.dataset.down) {
          const i = Number(t.dataset.up ?? t.dataset.down);
          const j = t.dataset.up ? i - 1 : i + 1;
          const slugs = S.categories.map((c) => c.slug);
          [slugs[i], slugs[j]] = [slugs[j], slugs[i]];
          await api('/api/categories/reorder', { method: 'POST', body: JSON.stringify({ slugs }) });
          await load();
        }
      } catch (e) { toast(e.message, 6000); }
    });
    $('#newCat').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const data = Object.fromEntries(new FormData(ev.target));
      try { await api('/api/categories', { method: 'POST', body: JSON.stringify(data) }); toast('Đã thêm danh mục.'); await load(); } catch (e) { toast(e.message, 6000); }
    });
  },
  discover(app) {
    const run = async (q) => {
      toast('Đang tìm trên GitHub…');
      try { S._found = (await api('/api/discover', { method: 'POST', body: JSON.stringify({ query: q }) })).items; render(); } catch (e) { toast(e.message, 6000); }
    };
    app.addEventListener('click', async (ev) => {
      const t = ev.target.closest('button');
      if (!t) return;
      if (t.dataset.q) run(t.dataset.q);
      if (t.dataset.add) {
        addPrefill = { repo: t.dataset.add, category: t.dataset.cat };
        editing = null;
        try { lookup = await api(`/api/lookup?repo=${encodeURIComponent(t.dataset.add)}`); } catch (e) { lookup = { ok: false, error: e.message }; }
        setTab('add');
      }
      if (t.dataset.dismiss) { await api('/api/candidates/dismiss', { method: 'POST', body: JSON.stringify({ full_name: t.dataset.dismiss }) }); if (S._found) S._found = S._found.filter((x) => x.full_name !== t.dataset.dismiss); await load(); }
    });
    $('#dq').addEventListener('submit', (ev) => { ev.preventDefault(); const q = new FormData(ev.target).get('q'); if (q) run(String(q)); });
  },
};

$('#logoutBtn').addEventListener('click', async () => { await fetch('/api/logout', { method: 'POST', headers: H }); location.reload(); });
fetch('/api/session').then((r) => r.json()).then((s) => {
  if (s.required) $('#logoutBtn').classList.remove('hidden');
  if (s.required && !s.ok) return showLogin();
  return load();
}).catch((e) => { $('#app').innerHTML = `<div class="notice danger">Không tải được dữ liệu: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
